name: CI

# Builds and tests on every platform the pure-Nim backends run on, under the
# C, C++ and JavaScript targets, tests the Cairo backend where Cairo can be
# installed, and checks formatting. Skips changes that only touch the docs.

on:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - "docs/**"
      - "**.md"
      - "zensical.toml"
      - "LICENSE"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Installs only Nim, at the version in mise.toml. The plugin downloads a
      # prebuilt release (a nightly build of the release on macOS), so nothing
      # is compiled and no extra tools like nimgrep or nimsuggest get built.
      # mise 2026.10.16 and later panic on Windows while unpacking the Nim
      # zip, so mise stays at 2026.10.15 until that is fixed.
      - uses: jdx/mise-action@v5.2.4
        with:
          version: "2026.10.15"
          plugins: nim https://github.com/elijahr/vfox-nim
          install_args: nim

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Cairo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install Cairo (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo

      - name: Test (C target)
        run: nimble -y test

      - name: Test (C++ target)
        run: nimble -y testcpp

      - name: Test (JavaScript target)
        run: nimble -y testjs

      # Compiles the examples' window without running it. The sdl3 package
      # loads SDL3 at run time, so the runners don't need SDL3 installed.
      - name: Build the example window
        run: |
          nimble -y setup
          nim c --hints:off --outdir:nimcache/examples examples/window.nim

      # The Cairo backend links libcairo, which the Windows runner lacks.
      - name: Test the Cairo backend
        if: runner.os != 'Windows'
        run: nimble -y testcairo

      - name: Render the samples
        run: nimble -y samples

      - uses: actions/upload-artifact@v6
        with:
          name: samples-${{ matrix.os }}
          path: out/

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs only nph. The Nim plugin is registered so mise.toml parses,
      # but Nim itself isn't needed to check formatting.
      - uses: jdx/mise-action@v5.2.4
        with:
          version: "2026.10.15"
          plugins: nim https://github.com/elijahr/vfox-nim
          install_args: github:arnetheduck/nph

      # Runs nph from PATH rather than through `mise exec`, which would
      # install the missing Nim first.
      - name: Check formatting
        run: nph --check src tests tools examples
