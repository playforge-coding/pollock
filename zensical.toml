[project]
site_name = "pollock"
site_description = "An abstract 2D graphics API for Nim."
site_url = "https://playforge-coding.github.io/pollock/"
repo_url = "https://github.com/playforge-coding/pollock"
repo_name = "playforge-coding/pollock"
copyright = "pollock is free software under the BSD-3-Clause license"

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Drawing" = "drawing.md" },
  { "The context" = "context.md" },
  { "Backends" = "backends.md" },
  { "Writing a backend" = "writing-a-backend.md" },
  { "Architecture" = "architecture.md" },
  { "Development" = "development.md" },
  { "Roadmap" = "roadmap.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
